# LawyerCMS: replace hostname, certificate paths, release path and PHP socket before enabling.
server {
    listen 80;
    server_name legal.example.com;
    return 301 https://legal.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name legal.example.com;
    ssl_certificate /etc/letsencrypt/live/legal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legal.example.com/privkey.pem;
    root /srv/lawyercms/current/public;
    index index.php;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/lawyercms.sock;
        fastcgi_read_timeout 60;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(storage|vendor|\.env|composer\.) { deny all; }
    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
