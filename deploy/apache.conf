# LawyerCMS: enable mod_rewrite, mod_ssl, mod_headers, proxy_fcgi; adjust paths/socket.
<VirtualHost *:443>
    ServerName legal.example.com
    DocumentRoot /srv/lawyercms/current/public
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/legal.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/legal.example.com/privkey.pem
    <Directory /srv/lawyercms/current/public>
        Options -Indexes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "^index\.php$">
        SetHandler "proxy:unix:/run/php/lawyercms.sock|fcgi://localhost/"
    </FilesMatch>
    <FilesMatch "^(?!index\.php$).*\.php$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    LimitRequestBody 28311552
    Header always set X-Content-Type-Options "nosniff"
</VirtualHost>
<VirtualHost *:80>
    ServerName legal.example.com
    Redirect permanent / https://legal.example.com/
</VirtualHost>
