; Author: ramanpal singh | URL: https://kwebby.com
; LawyerCMS: merge into CLI/FPM php.ini or conf.d (not raw FPM pool syntax).
; In a pool, use php_admin_value[...] / php_admin_flag[...] instead.
; CLI jobs require the same memory/extensions as web requests.
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 27M
max_execution_time = 60
display_errors = Off
log_errors = On
expose_php = Off
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
